main{max-width:560px;margin:0 auto}
header{text-align:center;margin-bottom:26px}
.avatar{width:min(280px,78%);height:auto;display:block;margin:0 auto 14px}
h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:2.2rem;line-height:1.1;margin:0 0 10px;color:var(--deep)}
.star{display:inline-block;width:.6em;height:.6em;margin:0 .35em;vertical-align:.1em}
.note{font-family:'Fraunces',Georgia,serif;font-style:italic;font-size:1.08rem;line-height:1.5;color:var(--ink);margin:0 auto;max-width:34ch;
  background:var(--white);border:1.5px solid var(--pink);border-radius:18px;padding:14px 18px}
ul{list-style:none;margin:0;padding:0}
li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:14px;
  padding:14px;margin-bottom:8px;background:var(--white);border:1.5px solid var(--pink);border-radius:16px;cursor:pointer}
li button:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
.n{width:26px;flex:none;display:flex;justify-content:center;color:var(--muted);font-size:.9rem}
.n svg{width:20px;height:20px;display:none}
.t{flex:1;min-width:0}
.t b{display:block;font-weight:500;font-size:1.02rem;overflow-wrap:anywhere}
.t span{display:block;color:var(--muted);font-size:.88rem;margin-top:2px}
li.on button{background:var(--pink-soft);border-color:var(--deep)}
li.on .t b{color:var(--deep)}
li.on .n .num{display:none}
li.on .n svg{display:block}
.why{display:none;margin:-2px 4px 12px;padding:12px 16px;background:var(--white);border:1.5px solid var(--pink);border-left:4px solid var(--deep);border-radius:12px;
  font-family:'Fraunces',Georgia,serif;font-style:italic;line-height:1.5}
li.on .why.has{display:block}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:2px solid var(--pink);
  padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 12px)}
#bar .in{max-width:560px;margin:0 auto;position:relative}
#bun{position:absolute;right:0;top:-62px;width:64px;height:64px;pointer-events:none}
#now{font-size:.95rem;font-weight:500;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:70px}
.ctl{display:flex;gap:10px;align-items:center}
.seekrow{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:.8rem;color:var(--muted)}
.seekrow span{width:2.6em;flex:none}
.seekrow span:last-child{text-align:right}
#seek{flex:1;min-width:0;accent-color:var(--deep);height:20px;margin:0}
#pp{all:unset;box-sizing:border-box;flex:none;width:56px;height:56px;border-radius:50%;background:var(--pink-soft);border:2px solid var(--deep);cursor:pointer;display:flex;align-items:center;justify-content:center}
#pp:focus-visible{outline:2px solid var(--deep);outline-offset:2px}
#pp svg{width:28px;height:28px}
#pp .moon{display:none}
#pp.playing .moon{display:block}
#pp.playing .star{display:none}
.ctl button{all:unset;flex:1;text-align:center;padding:9px 0;border:1.5px solid var(--pink);border-radius:12px;cursor:pointer;font-size:.92rem;color:var(--ink)}
.ctl button:focus-visible{outline:2px solid var(--deep)}
audio{width:100%;height:40px;accent-color:var(--deep)}

#editor{background:var(--white);border:2px solid var(--deep);border-radius:18px;padding:16px;margin-bottom:26px;text-align:left}
#editor h2{font-family:'Fraunces',Georgia,serif;font-size:1.3rem;margin:0 0 6px;color:var(--deep)}
#editor p{margin:0 0 14px;font-size:.92rem;line-height:1.45}
#editor label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:10px}
#editor input,#editor textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1.5px solid var(--pink);border-radius:10px;font:inherit;font-size:16px;color:var(--ink);background:var(--white)}
#editor input:focus,#editor textarea:focus{outline:2px solid var(--deep);outline-offset:1px}
.ed-song{border-top:1.5px solid var(--pink);padding-top:12px;margin-top:12px}
.ed-h{font-weight:500;margin-bottom:8px}
.ed-btns{display:flex;gap:8px;margin-bottom:10px}
.eb{all:unset;box-sizing:border-box;padding:8px 14px;border:1.5px solid var(--pink);border-radius:10px;cursor:pointer;font-size:.88rem;color:var(--ink);text-align:center}
.eb:focus-visible{outline:2px solid var(--deep)}
.eb.main{background:var(--deep);border-color:var(--deep);color:var(--white);display:block;margin-top:14px;padding:12px;font-weight:500}
.eb.wide{display:block;margin-top:12px}
</style>
</head>

    <h2>Edit mode</h2>
    <p>Change anything below and the page updates as you type. When you're done, press Download, then upload that file to GitHub to replace your old index.html. Nothing is saved until you do.</p>

    <div id="ed-songs"></div>
    <button class="eb wide" id="ed-add">Add a song</button>
    <button class="eb main" id="ed-dl">Download my index.html</button>

  songs: SONGS.map(s => ({ title: s.title || "", artist: s.artist || "", file: s.file || "", why: s.why || "" })) };

const list = document.getElementById("list");
const player = document.getElementById("player");
const now = document.getElementById("now");
let current = -1;

function render() {
  document.getElementById("title").textContent = state.title;
  document.title = state.title;
  document.getElementById("msg").textContent = state.message;
  list.innerHTML = "";
  state.songs.forEach((s, i) => {
    const li = document.createElement("li");
    if (i === current) li.classList.add("on");
    const b = document.createElement("button");
    b.innerHTML = '<span class="n"><span class="num"></span><svg viewBox="0 0 24 24"><use href="#st"/></svg></span><span class="t"><b></b><span></span></span>';
    b.querySelector(".num").textContent = i + 1;
    b.querySelector("b").textContent = s.title;
    b.querySelector(".t span").textContent = s.artist;
    b.addEventListener("click", () => {
      if (current === i) { player.paused ? player.play() : player.pause(); }
      else play(i);
    });
    li.appendChild(b);
    const w = document.createElement("div");
    w.className = "why" + (s.why ? " has" : "");
    w.textContent = s.why;
    li.appendChild(w);
    list.appendChild(li);
  });
}

function play(i) {
  const n = state.songs.length;
  if (i < 0 || i >= n) return;
  current = i;
  const s = state.songs[i];
  player.src = encodeURI(s.file);
  player.play().catch(() => { now.textContent = "Couldn't find " + s.file + " (check the file name)"; });
  now.textContent = s.title + (s.artist ? " · " + s.artist : "");
  [...list.children].forEach((li, k) => li.classList.toggle("on", k === i));
  list.children[i].scrollIntoView({ behavior: "smooth", block: "center" });
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: s.title, artist: s.artist });
    navigator.mediaSession.setActionHandler("nexttrack", () => play((current + 1) % n));
    navigator.mediaSession.setActionHandler("previoustrack", () => play((current - 1 + n) % n));
  }
}

player.addEventListener("ended", () => play((current + 1) % state.songs.length));
const pp = document.getElementById("pp");
const seek = document.getElementById("seek");
const tCur = document.getElementById("t-cur");
const tDur = document.getElementById("t-dur");
function fmt(t) { if (!isFinite(t)) return "0:00"; t = Math.floor(t); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
pp.onclick = () => {
  if (current < 0) play(0);
  else if (player.paused) player.play();
  else player.pause();
};
player.addEventListener("play", () => { pp.classList.add("playing"); pp.setAttribute("aria-label", "Pause"); });
player.addEventListener("pause", () => { pp.classList.remove("playing"); pp.setAttribute("aria-label", "Play"); });
player.addEventListener("loadedmetadata", () => { seek.max = player.duration || 100; tDur.textContent = fmt(player.duration); });
player.addEventListener("timeupdate", () => { seek.value = player.currentTime; tCur.textContent = fmt(player.currentTime); });
seek.addEventListener("input", () => { player.currentTime = seek.value; });
document.getElementById("next").onclick = () => play(current < 0 ? 0 : (current + 1) % state.songs.length);
document.getElementById("prev").onclick = () => play(current < 0 ? 0 : (current - 1 + state.songs.length) % state.songs.length);

/* ---------- editor ---------- */
function field(label, val, onInput, area) {
  const w = document.createElement("label");
  w.append(label);
  const el = document.createElement(area ? "textarea" : "input");
  if (area) el.rows = 3;
  el.value = val;
  el.addEventListener("input", () => { onInput(el.value); render(); });
  w.appendChild(el);
  return w;
}
function btn(text, fn) {
  const b = document.createElement("button");
  b.className = "eb"; b.textContent = text; b.onclick = fn;
  return b;
}
function changed() { current = -1; player.pause(); buildEditor(); render(); }
function buildEditor() {
  const top = document.getElementById("ed-top");
  top.innerHTML = "";
  top.append(field("Page title", state.title, v => state.title = v),
             field("Message to her", state.message, v => state.message = v, true));
  const box = document.getElementById("ed-songs");
  box.innerHTML = "";
  state.songs.forEach((s, i) => {
    const f = document.createElement("div");
    f.className = "ed-song";
    const h = document.createElement("div");
    h.className = "ed-h"; h.textContent = "Song " + (i + 1);
    const bar = document.createElement("div");
    bar.className = "ed-btns";
    bar.append(
      btn("Move up", () => { if (i > 0) { [state.songs[i-1], state.songs[i]] = [state.songs[i], state.songs[i-1]]; changed(); } }),
      btn("Move down", () => { if (i < state.songs.length - 1) { [state.songs[i+1], state.songs[i]] = [state.songs[i], state.songs[i+1]]; changed(); } }),
      btn("Remove", () => { state.songs.splice(i, 1); changed(); })
    );
    f.append(h, bar,
      field("Song name", s.title, v => s.title = v),
      field("Artist", s.artist, v => s.artist = v),
      field("File name (must match the mp3 on GitHub)", s.file, v => s.file = v),
      field("Why you picked it (she sees this while it plays)", s.why, v => s.why = v, true));
    box.appendChild(f);
  });
}
document.getElementById("ed-add").onclick = () => {
  const n = String(state.songs.length + 1).padStart(2, "0");
  state.songs.push({ title: "", artist: "", file: "songs/song" + n + ".mp3", why: "" });
  changed();
  document.querySelector("#ed-songs .ed-song:last-child input").focus();
};
function lit(v) { return JSON.stringify(v).replace(/</g, "\\u003c"); }
document.getElementById("ed-dl").onclick = () => {
  const c = document.documentElement.cloneNode(true);
  c.querySelector("#list").innerHTML = "";
  c.querySelector("#title").textContent = "";
  c.querySelector("#msg").textContent = "";
  c.querySelector("#editor").remove();
  c.querySelector("#now").textContent = "Tap a song to play";
  c.querySelector("audio").removeAttribute("src");
  c.querySelector("#pp").classList.remove("playing");
  c.querySelector("#t-cur").textContent = "0:00";
  c.querySelector("#t-dur").textContent = "0:00";
  c.querySelector("title").textContent = state.title;
  const block = "/*DATA-" + "START*/\nconst PAGE_TITLE = " + lit(state.title) + ";\nconst MESSAGE = " + lit(state.message) +
    ";\nconst SONGS = [\n" + state.songs.map(s => "  { title: " + lit(s.title) + ", artist: " + lit(s.artist) +
    ", file: " + lit(s.file) + ",\n    why: " + lit(s.why) + " }").join(",\n") + ",\n];\n/*DATA-" + "END*/";
  const sc = [...c.querySelectorAll("script")].pop();
  sc.textContent = sc.textContent.replace(/\/\*DATA-START\*\/[\s\S]*?\/\*DATA-END\*\//, () => block);
  const html = "<!DOCTYPE html>\n" + c.outerHTML;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([html], { type: "text/html" }));
  a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
};

render();
if (location.hash === "#edit") { document.getElementById("editor").hidden = false; buildEditor(); }
</script>
</body>
</html>
